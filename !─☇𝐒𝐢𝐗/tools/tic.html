<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Game 2 Pemain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .current-player {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .player-mark {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .mark-x {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .mark-o {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            gap: 10px;
        }

        .score {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 15px 20px;
            border-radius: 15px;
            text-align: center;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .score-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            aspect-ratio: 1;
        }

        .cell {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: none;
            border-radius: 15px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(.taken) {
            background: linear-gradient(135deg, #e0e7ff 0%, #cfd9df 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #f5576c;
            text-shadow: 2px 2px 4px rgba(245, 87, 108, 0.3);
        }

        .cell.o {
            color: #00f2fe;
            text-shadow: 2px 2px 4px rgba(0, 242, 254, 0.3);
        }

        .cell.winner {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
            min-height: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .win-message {
            color: #27ae60;
            font-size: 1.4em;
        }

        .draw-message {
            color: #e67e22;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .cell {
                font-size: 2em;
            }

            button {
                padding: 12px 24px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic Tac Toe</h1>
        
        <div class="game-info">
            <div class="current-player">
                Giliran: <span class="player-mark" id="currentMark"></span>
            </div>
        </div>

        <div class="score-board">
            <div class="score">
                <div class="score-label">Pemain X</div>
                <div class="score-value" id="scoreX">0</div>
            </div>
            <div class="score">
                <div class="score-label">Seri</div>
                <div class="score-value" id="scoreDraw">0</div>
            </div>
            <div class="score">
                <div class="score-label">Pemain O</div>
                <div class="score-value" id="scoreO">0</div>
            </div>
        </div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="controls">
            <button onclick="resetGame()">🔄 Main Lagi</button>
            <button onclick="resetScore()">📊 Reset Skor</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let scores = {
            X: 0,
            O: 0,
            draw: 0
        };

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function initGame() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            updateCurrentPlayer();
            loadScores();
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            if (board[index] !== '' || !gameActive) {
                return;
            }

            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add('taken', currentPlayer.toLowerCase());

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningCombination = null;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] === '' || board[b] === '' || board[c] === '') {
                    continue;
                }
                if (board[a] === board[b] && board[b] === board[c]) {
                    roundWon = true;
                    winningCombination = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                gameActive = false;
                highlightWinner(winningCombination);
                scores[currentPlayer]++;
                updateScores();
                showMessage(`🎉 Pemain ${currentPlayer} Menang!`, 'win-message');
                return;
            }

            if (!board.includes('')) {
                gameActive = false;
                scores.draw++;
                updateScores();
                showMessage('🤝 Permainan Seri!', 'draw-message');
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateCurrentPlayer();
        }

        function highlightWinner(combination) {
            const cells = document.querySelectorAll('.cell');
            combination.forEach(index => {
                cells[index].classList.add('winner');
            });
        }

        function updateCurrentPlayer() {
            const mark = document.getElementById('currentMark');
            mark.textContent = currentPlayer;
            mark.className = 'player-mark ' + (currentPlayer === 'X' ? 'mark-x' : 'mark-o');
        }

        function showMessage(msg, className = '') {
            const message = document.getElementById('message');
            message.textContent = msg;
            message.className = 'message ' + className;
        }

        function updateScores() {
            document.getElementById('scoreX').textContent = scores.X;
            document.getElementById('scoreO').textContent = scores.O;
            document.getElementById('scoreDraw').textContent = scores.draw;
            saveScores();
        }

        function saveScores() {
            localStorage.setItem('tictactoeScores', JSON.stringify(scores));
        }

        function loadScores() {
            const saved = localStorage.getItem('tictactoeScores');
            if (saved) {
                scores = JSON.parse(saved);
                updateScores();
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });

            updateCurrentPlayer();
            showMessage('');
        }

        function resetScore() {
            scores = { X: 0, O: 0, draw: 0 };
            updateScores();
            resetGame();
            showMessage('Skor telah direset!');
        }

        initGame();
    </script>
</body>
</html>
