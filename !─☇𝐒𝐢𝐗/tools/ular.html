<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ular Tangga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 100%;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: #e0e0e0;
            padding: 3px;
            border-radius: 8px;
            margin-bottom: 15px;
            max-width: 100%;
            aspect-ratio: 1;
        }

        .cell {
            aspect-ratio: 1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            position: relative;
            border-radius: 2px;
        }

        .cell.ladder {
            background: #2ecc71;
            color: white;
        }

        .cell.snake {
            background: #e74c3c;
            color: white;
        }

        .player {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid white;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .player1 {
            background: #3498db;
            top: 2px;
            left: 2px;
        }

        .player2 {
            background: #f39c12;
            bottom: 2px;
            right: 2px;
        }

        .controls {
            text-align: center;
            margin-top: 15px;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid #667eea;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .dice:active {
            transform: scale(0.95);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        .info {
            text-align: center;
            margin: 15px 0;
            font-size: 16px;
        }

        .current-player {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        .player-info {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            gap: 10px;
        }

        .player-card {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
            font-size: 14px;
        }

        .winner {
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            margin: 15px 0;
            animation: celebrate 0.5s ease-in-out;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-box {
            width: 15px;
            height: 15px;
            border-radius: 2px;
        }

        #result {
            margin: 10px 0;
            min-height: 20px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎲 Ular Tangga 🐍</h1>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: #2ecc71;"></div>
                <span>Tangga</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #e74c3c;"></div>
                <span>Ular</span>
            </div>
        </div>

        <div class="player-info">
            <div class="player-card">
                <div style="font-size: 20px;">🔵</div>
                <div>Pemain 1</div>
                <div>Posisi: <span id="pos1">0</span></div>
            </div>
            <div class="player-card">
                <div style="font-size: 20px;">🟠</div>
                <div>Pemain 2</div>
                <div>Posisi: <span id="pos2">0</span></div>
            </div>
        </div>

        <div class="info">
            <div class="current-player" id="currentPlayer">Giliran: Pemain 1 🔵</div>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
            <div id="result"></div>
            <div class="dice" id="dice" onclick="rollDice()">🎲</div>
            <div>
                <button onclick="resetGame()">Main Lagi</button>
            </div>
        </div>

        <div id="winnerMessage"></div>
    </div>

    <script>
        const snakes = {
            17: 7,
            54: 34,
            62: 19,
            64: 60,
            87: 36,
            93: 73,
            95: 75,
            99: 78
        };

        const ladders = {
            3: 22,
            5: 8,
            11: 26,
            20: 29,
            27: 1,
            40: 42,
            51: 67,
            71: 91,
            80: 100
        };

        let player1Pos = 0;
        let player2Pos = 0;
        let currentPlayer = 1;
        let gameOver = false;

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            for (let i = 10; i >= 1; i--) {
                for (let j = 1; j <= 10; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    let cellNum;
                    if (i % 2 === 0) {
                        cellNum = (i - 1) * 10 + j;
                    } else {
                        cellNum = (i - 1) * 10 + (11 - j);
                    }
                    
                    cell.textContent = cellNum;
                    cell.id = 'cell-' + cellNum;
                    
                    if (snakes[cellNum]) {
                        cell.classList.add('snake');
                        cell.title = 'Ular ke ' + snakes[cellNum];
                    }
                    if (ladders[cellNum]) {
                        cell.classList.add('ladder');
                        cell.title = 'Tangga ke ' + ladders[cellNum];
                    }
                    
                    board.appendChild(cell);
                }
            }
            
            updatePlayerPositions();
        }

        function updatePlayerPositions() {
            document.querySelectorAll('.player').forEach(p => p.remove());
            
            if (player1Pos > 0) {
                const cell1 = document.getElementById('cell-' + player1Pos);
                const p1 = document.createElement('div');
                p1.className = 'player player1';
                p1.textContent = '1';
                cell1.appendChild(p1);
            }
            
            if (player2Pos > 0) {
                const cell2 = document.getElementById('cell-' + player2Pos);
                const p2 = document.createElement('div');
                p2.className = 'player player2';
                p2.textContent = '2';
                cell2.appendChild(p2);
            }
            
            document.getElementById('pos1').textContent = player1Pos;
            document.getElementById('pos2').textContent = player2Pos;
        }

        function rollDice() {
            if (gameOver) return;
            
            const dice = Math.floor(Math.random() * 6) + 1;
            const diceEl = document.getElementById('dice');
            const resultEl = document.getElementById('result');
            
            diceEl.textContent = dice;
            resultEl.textContent = `Dadu: ${dice}`;
            
            setTimeout(() => {
                movePlayer(dice);
            }, 500);
        }

        function movePlayer(steps) {
            const resultEl = document.getElementById('result');
            
            if (currentPlayer === 1) {
                const oldPos = player1Pos;
                player1Pos += steps;
                
                if (player1Pos > 100) {
                    player1Pos = oldPos;
                    resultEl.textContent = `Dadu: ${steps} - Terlalu besar!`;
                    switchPlayer();
                    updatePlayerPositions();
                    return;
                }
                
                resultEl.textContent = `Dadu: ${steps} → Posisi ${player1Pos}`;
                
                if (snakes[player1Pos]) {
                    setTimeout(() => {
                        resultEl.textContent += ` 🐍 Turun ke ${snakes[player1Pos]}`;
                        player1Pos = snakes[player1Pos];
                        updatePlayerPositions();
                        checkWin();
                    }, 800);
                } else if (ladders[player1Pos]) {
                    setTimeout(() => {
                        resultEl.textContent += ` 🪜 Naik ke ${ladders[player1Pos]}`;
                        player1Pos = ladders[player1Pos];
                        updatePlayerPositions();
                        checkWin();
                    }, 800);
                } else {
                    checkWin();
                }
            } else {
                const oldPos = player2Pos;
                player2Pos += steps;
                
                if (player2Pos > 100) {
                    player2Pos = oldPos;
                    resultEl.textContent = `Dadu: ${steps} - Terlalu besar!`;
                    switchPlayer();
                    updatePlayerPositions();
                    return;
                }
                
                resultEl.textContent = `Dadu: ${steps} → Posisi ${player2Pos}`;
                
                if (snakes[player2Pos]) {
                    setTimeout(() => {
                        resultEl.textContent += ` 🐍 Turun ke ${snakes[player2Pos]}`;
                        player2Pos = snakes[player2Pos];
                        updatePlayerPositions();
                        checkWin();
                    }, 800);
                } else if (ladders[player2Pos]) {
                    setTimeout(() => {
                        resultEl.textContent += ` 🪜 Naik ke ${ladders[player2Pos]}`;
                        player2Pos = ladders[player2Pos];
                        updatePlayerPositions();
                        checkWin();
                    }, 800);
                } else {
                    checkWin();
                }
            }
            
            updatePlayerPositions();
        }

        function checkWin() {
            if (player1Pos === 100) {
                gameOver = true;
                showWinner(1);
            } else if (player2Pos === 100) {
                gameOver = true;
                showWinner(2);
            } else {
                setTimeout(switchPlayer, 1200);
            }
        }

        function switchPlayer() {
            if (gameOver) return;
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            const icon = currentPlayer === 1 ? '🔵' : '🟠';
            document.getElementById('currentPlayer').textContent = `Giliran: Pemain ${currentPlayer} ${icon}`;
        }

        function showWinner(player) {
            const icon = player === 1 ? '🔵' : '🟠';
            document.getElementById('winnerMessage').innerHTML = 
                `<div class="winner">🎉 Pemain ${player} ${icon} Menang! 🎉</div>`;
        }

        function resetGame() {
            player1Pos = 0;
            player2Pos = 0;
            currentPlayer = 1;
            gameOver = false;
            document.getElementById('dice').textContent = '🎲';
            document.getElementById('result').textContent = '';
            document.getElementById('winnerMessage').innerHTML = '';
            document.getElementById('currentPlayer').textContent = 'Giliran: Pemain 1 🔵';
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
